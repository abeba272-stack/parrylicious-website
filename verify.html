<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>E-Mail bestätigen – Parrylicious Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles-v2.css" />
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="alternate icon" href="assets/logo.jpg" />
  <style>
    .verify-icon{ font-size:42px; line-height:1; margin:0 0 6px; }
    .verify-icon.ok{ color:var(--accent); }
    .verify-icon.err{ color:#d6807b; }
    .verify-card{ text-align:center; }
    .verify-card .row{ justify-content:center; }
    .spinner{ width:34px; height:34px; margin:6px auto 0; border:3px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin{ to{ transform:rotate(360deg); } }
    @media (prefers-reduced-motion: reduce){ .spinner{ animation:none; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container row">
      <a class="brand" href="/"><span class="pl-mark" aria-hidden="true"></span><span class="wordmark">Parrylicious</span><span class="wordmark-tag">Studio</span></a>
      <nav class="nav">
        <a class="btn small ghost" href="/">Zur Website</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container narrow">
      <div class="section-head">
        <p class="kicker">E-Mail-Bestätigung</p>
        <h2>Konto bestätigen</h2>
      </div>

      <div class="card verify-card" id="verifyCard" aria-live="polite">
        <div class="spinner" id="verifySpinner"></div>
        <p class="muted" id="verifyMsg" style="margin-top:14px">Deine E-Mail wird bestätigt …</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-grid"><span class="pl-mark foot-mark" aria-hidden="true"></span>
      <div class="footer-links">
        <a href="impressum.html">Impressum</a>
        <a href="privacy.html">Datenschutz</a>
      </div>
      <div class="muted">© <span id="year"></span> Parrylicious</div>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const card = document.getElementById('verifyCard');

    function render(state, title, msg, actions) {
      const icon = state === 'ok' ? '✓' : '✕';
      const iconCls = state === 'ok' ? 'ok' : 'err';
      card.innerHTML = `
        <div class="verify-icon ${iconCls}">${icon}</div>
        <h3 style="margin:0 0 8px">${title}</h3>
        <p class="muted" style="margin:0 0 18px">${msg}</p>
        <div class="row gap">${actions}</div>
      `;
    }

    (async () => {
      const token = new URLSearchParams(location.search).get('token');
      if (!token) {
        render('err', 'Kein Bestätigungslink',
          'Dieser Link ist unvollständig. Bitte öffne den Link aus deiner Bestätigungs-E-Mail erneut.',
          '<a class="btn" href="login.html">Zum Login</a>');
        return;
      }
      try {
        const res = await fetch('/api/auth/verify-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });
        if (res.ok) {
          render('ok', 'E-Mail bestätigt',
            'Danke! Dein Konto ist jetzt bestätigt – dein <strong>Neukundenrabatt von 10 %</strong> ist für die erste Buchung aktiv.',
            '<a class="btn" href="booking.html">Jetzt Termin buchen</a><a class="btn ghost" href="konto.html">Mein Konto</a>');
        } else {
          render('err', 'Link ungültig oder abgelaufen',
            'Der Bestätigungslink ist ungültig oder älter als 24 Stunden. Melde dich an und fordere bei Bedarf eine neue Bestätigung an.',
            '<a class="btn" href="login.html">Zum Login</a>');
        }
      } catch (_error) {
        render('err', 'Etwas ist schiefgelaufen',
          'Wir konnten deine E-Mail gerade nicht bestätigen. Bitte versuche es in ein paar Minuten noch einmal.',
          '<a class="btn" href="verify.html' + location.search + '">Erneut versuchen</a>');
      }
    })();
  </script>
  <script type="module" src="nav.js"></script>
</body>
</html>
